services:
  postgres:
    image: postgres:17-alpine
    container_name: map-postgres
    environment:
      POSTGRES_DB: map_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d map_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map-backend
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/map_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: map-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
