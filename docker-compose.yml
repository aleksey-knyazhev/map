services:
  postgres:
    image: postgres:17-alpine
    container_name: map-postgres
    environment:
      POSTGRES_DB: map_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d map_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
