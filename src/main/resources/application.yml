micronaut:
  application:
    name: map-backend
  server:
    port: 8080
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:5173
            - http://127.0.0.1:5173
          allowed-methods:
            - GET
            - POST
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Authorization

datasources:
  default:
    url: ${JDBC_URL:`jdbc:postgresql://localhost:5433/map_db`}
    username: ${DB_USERNAME:map_user}
    password: ${DB_PASSWORD:map_password}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES
    maximum-pool-size: 10
    minimum-idle: 1
    initialization-fail-timeout: -1

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false
        format_sql: true
