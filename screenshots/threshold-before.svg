<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">До превышения порога MOVE_THRESHOLD_RATIO</title>
  <desc id="desc">Центр экрана смещен внутри текущей pre-fetch области, новая загрузка еще не выполняется.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#cbd5c6" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#e7efe4"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="0.75"/>
  <path d="M60 370C180 310 240 390 360 330C500 260 560 350 700 290C790 250 850 270 930 235" fill="none" stroke="#9dbb9d" stroke-width="18" opacity="0.5"/>
  <path d="M40 145C150 110 210 165 315 128C445 80 500 160 620 128C725 100 820 130 930 86" fill="none" stroke="#b4c8d7" stroke-width="26" opacity="0.6"/>

  <rect x="210" y="80" width="540" height="380" fill="none" stroke="#d11f1f" stroke-width="10" stroke-dasharray="28 24"/>
  <text x="480" y="58" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17211b">До превышения порога</text>
  <text x="480" y="492" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#445047">Центр экрана смещен меньше чем на 50%, pre-fetch область остается прежней</text>

  <line x1="480" y1="270" x2="635" y2="270" stroke="#111827" stroke-width="3" stroke-dasharray="10 8" opacity="0.65"/>
  <circle cx="480" cy="270" r="8" fill="#111827"/>
  <text x="480" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">центр последней загрузки</text>

  <g transform="translate(585 205)">
    <rect x="0" y="0" width="100" height="130" rx="10" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <rect x="18" y="28" width="64" height="64" fill="none" stroke="#111827" stroke-width="3"/>
    <circle cx="50" cy="13" r="3" fill="#111827"/>
    <circle cx="50" cy="113" r="8" fill="none" stroke="#111827" stroke-width="3"/>
  </g>
  <circle cx="635" cy="270" r="8" fill="#1d4ed8"/>
  <text x="635" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#111827">текущий центр экрана</text>
</svg>
