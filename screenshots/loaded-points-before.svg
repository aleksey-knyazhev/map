  <text x="28" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17211b">Наземная станция</text>
  <text x="28" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17211b">мониторинга</text>

