<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">До изменения количества загруженных точек</title>
  <desc id="desc">Состояние интерфейса до нового pre-fetch запроса: загружено 8 точек.</desc>
  <rect width="960" height="540" fill="#ebe7dc"/>
